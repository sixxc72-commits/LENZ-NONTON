<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nonton - LENZ NONTON</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<main>
  <section class="section">
    <h2 id="title" style="margin-bottom:14px">Memuat data...</h2>
    
    <div id="player-container" class="player-wrap">
        <iframe id="player" allowfullscreen src=""></iframe>
    </div>
    
    <div id="server-section">
      <div class="muted" style="margin-bottom:6px;font-size:13px">Pilih Server Streaming:</div>
      <div id="servers" class="server-list btn-grid"></div>
    </div>

    <div style="margin-top:24px">
      <div class="muted" style="margin-bottom:8px;font-size:13px">Download Episode:</div>
      <div id="downloads" class="dl-list"></div>
    </div>
    
    <div style="margin-top:24px">
      <a id="back" class="btn ghost" href="#">← Kembali ke Detail</a>
    </div>
  </section>
</main>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
mountShell();
const id = Util.qs("id");
const slug = Util.qs("slug");
const $ = (x) => document.getElementById(x);
if (slug) $("back").href = "detail.html?slug=" + encodeURIComponent(slug);

if (!id) {
  $("title").innerHTML = Util.errorBox("ID episode tidak ada");
} else {
  // Fungsi utama untuk memuat data
  function loadWatchData() {
    API.watch(id)
      .then((res) => {
        const data = res.data || res.result || res;
        if (!data || Object.keys(data).length === 0) throw new Error("Empty Data");
        
        $("title").textContent = data.title || "Sedang Diputar";
        const servers = data.streaming_servers || data.servers || data.stream || [];
        
        if (servers.length === 0) {
          showError("Maaf, link streaming belum tersedia untuk episode ini.");
        } else {
          $("player").src = servers[0].url;
          $("servers").innerHTML = servers.map((s, i) => 
            `<button class="server-btn ${i === 0 ? "active" : ""}" onclick="changeServer(this, '${s.url}')">${s.name}</button>`
          ).join("");
        }

        const downloads = data.download_links || data.downloads || data.download || [];
        $("downloads").innerHTML = downloads.length > 0 ? downloads.map(dl => 
            `<div class="dl-card"><h4>${dl.quality || "Source"}</h4><a href="${dl.url}" target="_blank">Download</a></div>`
        ).join("") : '<p class="muted">Tidak ada link download.</p>';
      })
      .catch(() => showError("Gagal menghubungi server API. Periksa koneksi Anda."));
  }

  function showError(msg) {
    $("player-container").innerHTML = `<div style="padding:40px; text-align:center; color:#ff4757;"><h3>${msg}</h3></div>`;
    $("server-section").style.display = "none";
  }

  function changeServer(btn, url) {
    $("player").src = url;
    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  loadWatchData();
}
</script>
</body>
</html>
