<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nonton - LENZ NONTON</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .btn-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .server-btn { padding: 8px 16px; border: 1px solid #333; background: #1a1a1a; color: #fff; cursor: pointer; border-radius: 4px; }
    .server-btn.active { background: #ff4757; border-color: #ff4757; }
    .player-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; }
    .player-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .dl-card { border: 1px solid #333; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
  </style>
</head>
<body>
<main>
  <section class="section">
    <h2 id="title" style="margin-bottom:14px">Memuat data...</h2>
    <div id="player-container" class="player-wrap">
        <iframe id="player" allowfullscreen src=""></iframe>
    </div>
    <div id="server-section">
      <div class="muted" style="margin-bottom:6px;font-size:13px">Pilih Server Streaming:</div>
      <div id="servers" class="server-list btn-grid"></div>
    </div>
    <div style="margin-top:24px">
      <div class="muted" style="margin-bottom:8px;font-size:13px">Download Episode:</div>
      <div id="downloads" class="dl-list"></div>
    </div>
    <div style="margin-top:24px">
      <a id="back" class="btn ghost" href="#">← Kembali ke Detail</a>
    </div>
  </section>
</main>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
mountShell();
const id = Util.qs("id");
const slug = Util.qs("slug");
const $ = (x) => document.getElementById(x);
if (slug) $("back").href = "detail.html?slug=" + encodeURIComponent(slug);

function renderUI(data) {
    $("title").textContent = data.title || data.seriesTitle || "Sedang Diputar";
    
    // Deteksi sumber data (Lama vs Baru)
    const servers = data.streaming_servers || data.servers || data.stream || data.videoServer || [];
    
    if (servers.length === 0) {
        showError("Maaf, link streaming belum tersedia untuk episode ini.");
    } else {
        const firstUrl = servers[0].url || servers[0].iframeSrc;
        $("player").src = firstUrl;
        $("servers").innerHTML = servers.map((s, i) => 
            `<button class="server-btn ${i === 0 ? "active" : ""}" onclick="changeServer(this, '${s.url || s.iframeSrc}')">${s.name || "Server " + (i+1)}</button>`
        ).join("");
    }

    const downloads = data.download_links || data.downloads || data.download || data.downloadBox || [];
    $("downloads").innerHTML = downloads.length > 0 ? downloads.map(dl => 
        `<div class="dl-card"><h4>${dl.quality || "Source"}</h4><a href="${dl.url || (dl.links && dl.links[0]?.url)}" target="_blank">Download</a></div>`
    ).join("") : '<p class="muted">Tidak ada link download.</p>';
}

function showError(msg) {
    $("player-container").innerHTML = `<div style="padding:40px; text-align:center; color:#ff4757;"><h3>${msg}</h3></div>`;
    $("server-section").style.display = "none";
}

function changeServer(btn, url) {
    $("player").src = url;
    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

// Logika Fallback Otomatis
async function init() {
    try {
        // Coba API utama
        const res = await API.watch(id || slug);
        const data = res.data || res.result || res;
        
        if (data && (data.streaming_servers?.length > 0 || data.videoServer?.length > 0)) {
            renderUI(data);
        } else {
            throw new Error("Data Kosong");
        }
    } catch (e) {
        // Jika gagal, coba API cadangan
        try {
            const streamRes = await StreamAPI.get(slug);
            if (streamRes.success) {
                renderUI(streamRes.data);
            } else {
                showError("Link streaming tidak ditemukan di semua server.");
            }
        } catch (err) {
            showError("Gagal memuat video dari server.");
        }
    }
}

init();
</script>
</body>
</html>
