<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nonton - LENZ NONTON</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .btn-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .server-btn { padding: 8px 16px; border: 1px solid #333; background: #1a1a1a; color: #fff; cursor: pointer; border-radius: 4px; }
    .server-btn.active { background: #ff4757; border-color: #ff4757; }
    .player-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; }
    .player-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .dl-card { border: 1px solid #333; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
  </style>
</head>
<body>
<main>
  <section class="section">
    <h2 id="title" style="margin-bottom:14px">Memuat data...</h2>
    
    <div id="player-container" class="player-wrap">
        <iframe id="player" allowfullscreen src=""></iframe>
    </div>

    <div id="server-section" style="margin-top:16px">
      <div class="muted" style="margin-bottom:6px;font-size:13px">Pilih Server Streaming:</div>
      <div id="servers" class="server-list btn-grid"></div>
    </div>

    <div style="margin-top:24px">
      <div class="muted" style="margin-bottom:8px;font-size:13px">Download Episode:</div>
      <div id="downloads" class="dl-list"></div>
    </div>

    <div style="margin-top:24px">
      <a id="back" class="btn ghost" href="#">← Kembali ke Detail</a>
    </div>
  </section>
</main>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
mountShell();
const id = Util.qs("id");
const slug = Util.qs("slug");
const $ = (x) => document.getElementById(x);
if (slug) $("back").href = "detail.html?slug=" + encodeURIComponent(slug);

function renderUI(res) {
    if (!res || !res.success || !res.data) {
        showError("Maaf, data video tidak valid atau tidak ditemukan.");
        return;
    }

    const data = res.data;
    $("title").textContent = data.title || data.seriesTitle || "Sedang Diputar";
    
    const servers = data.videoServer || [];
    $("server-section").style.display = servers.length > 0 ? "block" : "none";
    
    if (servers.length === 0) {
        showError("Maaf, link streaming belum tersedia untuk episode ini.");
    } else {
        $("player").src = servers[0].iframeSrc;
        $("servers").innerHTML = servers.map((s, i) => 
            `<button class="server-btn ${i === 0 ? "active" : ""}" onclick="changeServer(this, '${s.iframeSrc}')">${s.name}</button>`
        ).join("");
    }

    const downloadBox = data.downloadBox || [];
    if (downloadBox.length > 0 && downloadBox[0].qualities) {
        $("downloads").innerHTML = downloadBox[0].qualities.map(q => {
            const link = q.links?.[0]?.url || "#";
            const name = q.links?.[0]?.name || "Server";
            return `<div class="dl-card"><h4>${q.quality} (${name})</h4><a href="${link}" target="_blank">Download</a></div>`;
        }).join("");
    } else {
        $("downloads").innerHTML = '<p class="muted">Tidak ada link download.</p>';
    }
}

function showError(msg) {
    $("player-container").innerHTML = `<div style="padding:40px; text-align:center; color:#ff4757;"><h3>${msg}</h3></div>`;
    $("server-section").style.display = "none";
}

function changeServer(btn, url) {
    $("player").src = url;
    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

async function init() {
    // PERBAIKAN: Dahulukan id karena menyimpan nama lengkap episode streaming
    const targetSlug = id || slug;
    if (!targetSlug) {
        showError("Parameter episode tidak ditemukan di URL.");
        return;
    }

    try {
        const res = await API.watch(targetSlug);
        renderUI(res);
    } catch (e) {
        console.error("Fetch Error:", e);
        showError("Maaf, link streaming belum tersedia untuk episode ini di server.");
    }
}

init();
</script>
</body>
</html>
